<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Guru & Dosen - AbsensiQR</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

  <header>
    <a href="#main" class="skip-link">Lewati ke konten utama</a>
    <img src="logo_absensiqr.png" alt="Logo AbsensiQR" width="90">
    <h1>Absensi<span>QR</span> <small style="font-size:0.6em; color:var(--primary);">(Panel Dosen)</small></h1>

    <nav aria-label="Navigasi Utama">
      <a href="dashboard-guru.html">Dashboard</a>
      <a href="#buat-sesi">Buat Sesi</a>
      <a href="#rekap">Daftar Sesi</a>
      <a href="#" id="btn-logout" style="color: #dc2626; font-weight:bold;">Keluar</a>
      <button type="button" id="theme-toggle" aria-label="Ganti Tema">🌙</button>
    </nav>
  </header>

  <main id="main">

    <!-- Form Tambah Sesi -->
    <section id="buat-sesi">
      <h2>Buat Sesi Mata Kuliah Baru</h2>
      <article class="saran-form-box">
        <form id="form-buat-sesi" action="#" method="POST">
          <p>
            <label for="nama_sesi">Nama Sesi / Mata Kuliah *</label>
            <input type="text" id="nama_sesi" name="nama_sesi" placeholder="Contoh: Pemrograman Web - Kelas A" required>
          </p>
          <p>
            <label for="kode_qr">Kode Sesi QR *</label>
            <input type="text" id="kode_qr" name="kode_qr" placeholder="Contoh: QR-PEMWEB-01" required>
          </p>
          <p>
            <label for="kategori">Kategori Sesi *</label>
            <select id="kategori" name="kategori" required>
              <option value="Perkuliahan">Perkuliahan / Sekolah</option>
              <option value="Praktikum">Praktikum Lab</option>
              <option value="Seminar">Seminar / Workshop</option>
            </select>
          </p>
          <p>
            <label for="berlaku_sampai">Batas Waktu *</label>
            <input type="datetime-local" id="berlaku_sampai" name="berlaku_sampai" required>
          </p>
          <button type="submit" class="btn-primary">Simpan Sesi Mata Kuliah</button>
        </form>
      </article>
    </section>

    <!-- Daftar Sesi & Tombol Edit/Hapus -->    
    <section id="rekap">
      <h2>Daftar Sesi Mata Kuliah</h2>
      <article class="saran-form-box" style="margin-bottom: 1rem;">
        <p>
          <label for="input-search">Cari Nama Sesi / Mata Kuliah / Kode QR:</label>
          <input type="search" id="input-search" placeholder="Ketik kata kunci pencarian..." aria-label="Cari Sesi">
        </p>
      </article>

      <section id="daftar-sesi" class="cards-grid"></section>
    </section>

  </main>

  <!-- Dialog Modal Edit Sesi -->
  <dialog id="modal-edit-sesi">
    <h3>Edit Sesi Mata Kuliah</h3>
    <form id="form-edit-sesi" method="POST">
      <input type="hidden" id="edit-id">
      <p>
        <label for="edit-nama_sesi">Nama Sesi / Mata Kuliah</label>
        <input type="text" id="edit-nama_sesi" required>
      </p>
      <p>
        <label for="edit-kode_qr">Kode Sesi QR</label>
        <input type="text" id="edit-kode_qr" required>
      </p>
      <p>
        <label for="edit-kategori">Kategori</label>
        <select id="edit-kategori" required>
          <option value="Perkuliahan">Perkuliahan / Sekolah</option>
          <option value="Praktikum">Praktikum Lab</option>
          <option value="Seminar">Seminar / Workshop</option>
        </select>
      </p>
      <p>
        <label for="edit-berlaku_sampai">Batas Waktu</label>
        <input type="datetime-local" id="edit-berlaku_sampai" required>
      </p>
      <menu style="display:flex; gap:10px; margin-top:15px; padding:0;">
        <button type="submit" class="btn-primary">Simpan Perubahan</button>
        <button type="button" id="btn-cancel-edit" style="background:#64748b; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">Batal</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
