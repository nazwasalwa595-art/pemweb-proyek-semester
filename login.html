<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - AbsensiQR</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

  <header>
    <a href="#main">Lewati ke konten utama</a>
    <img src="logo_absensiqr.png" alt="Logo AbsensiQR">
    <h1>Absensi<span>QR</span></h1>
    <nav aria-label="Navigasi Utama">
      <a href="index.html#beranda">Beranda</a>
      <a href="login.html" class="nav-btn-login">Masuk</a>
      <a href="register.html">Daftar</a>
      <button id="theme-toggle" type="button" aria-label="Ganti Tema">🌙</button>
    </nav>
  </header>

  <main id="main">
    <section class="auth-container">
      
      <!-- Kolom Kiri: Informasi -->
      <article class="auth-info">
        <h2>Masuk ke AbsensiQR</h2>
        <p>Silakan masukkan Username (NIM/NIP berupa angka saja) dan kata sandi Anda.</p>
        <figure>
          <img src="gambar_ilustrasi_scanqr.png" alt="Ilustrasi Login AbsensiQR">
        </figure>
      </article>

      <!-- Kolom Kanan: Form Login -->
      <article class="auth-form-box">
        <p id="login-summary" class="error-summary" aria-live="polite"></p>

        <form id="form-login" action="#" method="POST" novalidate>
          
          <!-- Login menggunakan Username (Hanya Angka) -->
          <p>
            <label for="login-username">Username (NIM / NIP) *</label>
            <input 
              id="login-username" 
              name="username" 
              type="text" 
              inputmode="numeric" 
              placeholder="Masukkan angka NIM / NIP" 
              required 
              aria-describedby="err-login-username"
            >
            <span id="err-login-username" class="error-msg" aria-live="polite"></span>
          </p>

          <p>
            <label for="login-password">Kata Sandi *</label>
            <input id="login-password" name="password" type="password" placeholder="Masukkan kata sandi" required aria-describedby="err-login-password">
            <span id="err-login-password" class="error-msg" aria-live="polite"></span>
          </p>

          <button type="submit" id="btn-submit-login">Masuk</button>
        </form>

        <p class="auth-link">
          Belum punya akun? <a href="register.html">Daftar di sini</a>
        </p>
      </article>

    </section>
  </main>

  <footer>
    <section>
      <h2>Absensi<span>QR</span></h2>
      <p>&copy; 2026 AbsensiQR. All rights reserved.</p>
    </section>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
