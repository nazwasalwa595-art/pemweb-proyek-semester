<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Akun - AbsensiQR</title>
  
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

  <header>
    <a href="#main">Lewati ke konten utama</a>
    <img src="logo_absensiqr.png" alt="Logo AbsensiQR">
    <h1>Absensi<span>QR</span></h1>
    <nav aria-label="Navigasi Utama">
      <a href="index.html#beranda">Beranda</a>
      <a href="login.html">Masuk</a>
      <a href="register.html" class="nav-btn-login">Daftar</a>
      <button id="theme-toggle" type="button" aria-label="Ganti Tema">🌙</button>
    </nav>
  </header>

  <main id="main">
    <section class="auth-container">
      
      <!-- Kolom Kiri: Informasi & Gambar -->
      <article class="auth-info">
        <h2>Daftar Akun Baru</h2>
        <p>Pilih peran Anda dan masukkan Username berupa angka saja (NIM/NIP) untuk pendaftaran akun AbsensiQR.</p>
        <figure>
          <img src="gambar_ilustrasi_scanqr.png" alt="Ilustrasi Registrasi AbsensiQR">
        </figure>
      </article>

      <!-- Kolom Kanan: Form Pendaftaran -->
      <article class="auth-form-box">
        <p id="form-summary" class="error-summary" aria-live="polite"></p>

        <form id="form-register" action="#" method="POST" novalidate>
          
          <!-- 1. Pilihan Peran Pengguna -->
          <p>
            <label for="peran">Daftar Sebagai *</label>
            <select id="peran" name="peran" required aria-describedby="err-peran">
              <option value="">-- Pilih Peran --</option>
              <option value="Siswa / Mahasiswa">Siswa / Mahasiswa</option>
              <option value="Guru / Dosen">Guru / Dosen</option>
            </select>
            <span id="err-peran" class="error-msg" aria-live="polite"></span>
          </p>

          <!-- 2. Input Username (Wajib Angka) -->
          <p>
            <label for="username">Username (NIM / NIS / NPM / NIP / NIDN) *</label>
            <input 
              id="username" 
              name="username" 
              type="text" 
              inputmode="numeric" 
              placeholder="Contoh: 2440304021 (Hanya Angka)" 
              required 
              aria-describedby="err-username"
            >
            <small class="input-hint">Wajib berupa angka (8–18 digit).</small>
            <span id="err-username" class="error-msg" aria-live="polite"></span>
          </p>

          <!-- 3. Input Nama Lengkap -->
          <p>
            <label for="nama">Nama Lengkap *</label>
            <input id="nama" name="nama" type="text" placeholder="Masukkan nama lengkap Anda" required aria-describedby="err-nama">
            <span id="err-nama" class="error-msg" aria-live="polite"></span>
          </p>

          <!-- 4. Input Email -->
          <p>
            <label for="email">Alamat Email *</label>
            <input id="email" name="email" type="email" placeholder="nama@email.com" required aria-describedby="err-email">
            <span id="err-email" class="error-msg" aria-live="polite"></span>
          </p>

          <!-- 5. Input Kata Sandi -->
          <p>
            <label for="password">Kata Sandi *</label>
            <input id="password" name="password" type="password" placeholder="Minimal 6 karakter" required aria-describedby="err-password">
            <span id="err-password" class="error-msg" aria-live="polite"></span>
          </p>

          <!-- 6. Konfirmasi Kata Sandi -->
          <p>
            <label for="confirm-password">Konfirmasi Kata Sandi *</label>
            <input id="confirm-password" name="confirmPassword" type="password" placeholder="Ulangi kata sandi" required aria-describedby="err-confirm-password">
            <span id="err-confirm-password" class="error-msg" aria-live="polite"></span>
          </p>

          <button type="submit" id="btn-submit-register">Daftar Sekarang</button>
        </form>

        <p class="auth-link">
          Sudah punya akun? <a href="login.html">Masuk di sini</a>
        </p>
      </article>

    </section>
  </main>

  <footer>
    <section>
      <h2>Absensi<span>QR</span></h2>
      <p>&copy; 2026 AbsensiQR. All rights reserved.</p>
    </section>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
